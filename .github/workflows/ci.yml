name: gooo-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Verify .gooo authority and PR policy
        run: go run ./cmd/gooo-verify --contract .gooo/bootstrap.gooo --event "$GITHUB_EVENT_NAME" --output "$RUNNER_TEMP/gooo-bootstrap-evidence.json"
      - name: Run Go tests
        run: go test ./...
      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-bootstrap-evidence
          path: ${{ runner.temp }}/gooo-bootstrap-evidence.json
          if-no-files-found: error
